name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect changed areas
        id: changes
        shell: bash
        run: |
          git rev-parse --verify "$PR_BASE_SHA^{commit}" >/dev/null
          for area in frontend backend; do
            if git diff --quiet "$PR_BASE_SHA...HEAD" -- "$area"; then
              echo "$area=false" >> "$GITHUB_OUTPUT"
            else
              echo "$area=true" >> "$GITHUB_OUTPUT"
            fi
          done
          if git diff --quiet "$PR_BASE_SHA...HEAD" -- scripts/format.mjs scripts/format.test.mjs; then
            echo 'formatter=false' >> "$GITHUB_OUTPUT"
          else
            echo 'formatter=true' >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet "$PR_BASE_SHA...HEAD" -- '*.py'; then
            echo 'python=false' >> "$GITHUB_OUTPUT"
          else
            echo 'python=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install Python formatter
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.python == 'true' || steps.changes.outputs.formatter == 'true'
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt

      - name: Check changed-file formatting
        run: node scripts/format.mjs --check "--base=$PR_BASE_SHA"

      - name: Test formatter
        if: steps.changes.outputs.formatter == 'true'
        run: node --test scripts/format.test.mjs

      - name: Test frontend learning flow
        if: steps.changes.outputs.frontend == 'true'
        run: >-
          pnpm --dir frontend exec vitest run
          src/stores/__tests__/agent.spec.ts
          src/stores/__tests__/plans.spec.ts
          src/stores/__tests__/memories.spec.ts
          src/components/agent
          src/components/planning
          src/components/profile/__tests__/AgentMemorySection.spec.ts
          src/components/__tests__/onboardingEntry.spec.ts
          src/composables/__tests__/useOnboardingFlow.spec.ts
          src/composables/__tests__/useAssessment.spec.ts
          src/views/__tests__/Home.planTabs.spec.ts
          src/api/__tests__/learningAgent.contract.spec.ts

      - name: Build frontend
        if: steps.changes.outputs.frontend == 'true'
        run: pnpm --dir frontend build

      - name: Install backend dependencies
        if: steps.changes.outputs.backend == 'true'
        run: backend/.venv/bin/python -m pip install -r backend/requirements.txt

      - name: Test backend learning flow
        if: steps.changes.outputs.backend == 'true'
        working-directory: backend
        run: .venv/bin/python -m pytest tests/p0
